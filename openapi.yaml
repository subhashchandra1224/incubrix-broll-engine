openapi: 3.1.0
info:
  title: B-roll Engine
  description: Script and Voiceover to B-roll Video Engine. Accepts a script, an audio
    voiceover, or a scene list and returns a finished, licence-clean B-roll video
    with captions and a full record of where every clip came from.
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - health
      summary: Liveness probe
      description: App process is up.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Health Get
  /ready:
    get:
      tags:
      - health
      summary: Readiness probe
      description: All dependencies reachable.
      operationId: ready_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/broll/jobs:
    post:
      tags:
      - jobs
      summary: Create a B-roll video generation job
      description: 'Accept a script, audio URL, or scene list and queue a background
        job.


        Idempotency: send the same request twice with the same Idempotency-Key and

        you get the same job back; the work is never done twice.'
      operationId: create_job_api_v1_broll_jobs_post
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreateRequest'
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAcceptedResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/jobs/{job_id}:
    get:
      tags:
      - jobs
      summary: Get job status and progress
      operationId: get_job_status_api_v1_jobs__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: string
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/_debug/error/{code}:
    get:
      tags:
      - debug
      summary: Raise Error
      description: Raise a specific error so tests can check the response envelope.
      operationId: raise_error_api_v1__debug_error__code__get
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          title: Code
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/_debug/echo:
    post:
      tags:
      - debug
      summary: Echo
      description: Echo back the body; used to trigger RequestValidationError on bad
        input.
      operationId: echo_api_v1__debug_echo_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EchoIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EchoIn'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    Captions:
      properties:
        burn_in:
          type: boolean
          title: Burn In
          default: false
        srt:
          type: boolean
          title: Srt
          default: true
      type: object
      title: Captions
    EchoIn:
      properties:
        name:
          type: string
          title: Name
        count:
          type: integer
          title: Count
      type: object
      required:
      - name
      - count
      title: EchoIn
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    JobAcceptedResponse:
      properties:
        job_id:
          type: string
          title: Job Id
        status:
          type: string
          title: Status
        status_url:
          type: string
          title: Status Url
      type: object
      required:
      - job_id
      - status
      - status_url
      title: JobAcceptedResponse
      description: Returned by POST /api/v1/broll/jobs (HTTP 202).
    JobCreateRequest:
      properties:
        audio_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Audio Url
        script:
          anyOf:
          - type: string
          - type: 'null'
          title: Script
        scenes:
          anyOf:
          - items:
              $ref: '#/components/schemas/SceneItem'
            type: array
          - type: 'null'
          title: Scenes
        voice:
          anyOf:
          - type: string
          - type: 'null'
          title: Voice
        aspect_ratios:
          items:
            type: string
            enum:
            - '16:9'
            - '9:16'
            - '1:1'
          type: array
          minItems: 1
          title: Aspect Ratios
        style:
          anyOf:
          - type: string
          - type: 'null'
          title: Style
        avoid:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Avoid
        captions:
          anyOf:
          - $ref: '#/components/schemas/Captions'
          - type: 'null'
        callback_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Callback Url
      type: object
      required:
      - aspect_ratios
      title: JobCreateRequest
      description: Create a B-roll job. Exactly one of audio_url / script / scenes.
    JobStatusResponse:
      properties:
        job_id:
          type: string
          title: Job Id
        status:
          type: string
          title: Status
        progress:
          type: integer
          title: Progress
        result:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Result
        error:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Error
      type: object
      required:
      - job_id
      - status
      - progress
      title: JobStatusResponse
      description: Returned by GET /api/v1/jobs/{job_id}.
    SceneItem:
      properties:
        text:
          type: string
          minLength: 1
          title: Text
          description: Narration text for the scene.
        visual_hint:
          anyOf:
          - type: string
          - type: 'null'
          title: Visual Hint
          description: Optional visual guidance.
      type: object
      required:
      - text
      title: SceneItem
      description: One pre-segmented scene (IncuBrix scene list support).
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
