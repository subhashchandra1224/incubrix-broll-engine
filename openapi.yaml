openapi: 3.1.0
info:
  title: B-roll Engine
  description: Script and Voiceover to B-roll Video Engine. Accepts a script, an audio
    voiceover, or a scene list and returns a finished, licence-clean B-roll video
    with captions and a full record of where every clip came from.
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - health
      summary: Liveness probe
      description: App process is up.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Health Get
  /ready:
    get:
      tags:
      - health
      summary: Readiness probe
      description: All dependencies reachable.
      operationId: ready_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /api/v1/_debug/error/{code}:
    get:
      tags:
      - debug
      summary: Raise Error
      description: Raise a specific error so tests can check the response envelope.
      operationId: raise_error_api_v1__debug_error__code__get
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
          title: Code
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/_debug/echo:
    post:
      tags:
      - debug
      summary: Echo
      description: Echo back the body; used to trigger RequestValidationError on bad
        input.
      operationId: echo_api_v1__debug_echo_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EchoIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EchoIn'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    EchoIn:
      properties:
        name:
          type: string
          title: Name
        count:
          type: integer
          title: Count
      type: object
      required:
      - name
      - count
      title: EchoIn
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
